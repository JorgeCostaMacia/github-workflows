# Release: this repository's own workflow, not one to call. When a vX.Y.Z tag is pushed, it creates the matching
# GitHub Release with auto-generated notes.
#
# Only tags with three numbers: the major tag (v1) is moved on every release, so it never gets a Release of its own.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
