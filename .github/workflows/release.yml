# Release: this repository's own workflow, not one to call. When a vX.Y.Z tag is pushed, it creates the matching
# GitHub Release through github-release, from the same commit: its notes are the tag's section of CHANGELOG.md.
#
# Only tags with three numbers: the major tag (v1) is moved on every release, so it never gets a Release of its own.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    uses: ./.github/workflows/github-release.yml
